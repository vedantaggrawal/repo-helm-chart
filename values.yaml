replicaCount: 1

image:
  repository: ghcr.io/vedantaggrawal/devops-test-webserver
  pullPolicy: IfNotPresent
  tag: "latest"

canary:
  enabled: false
  # If true, uses Argo Rollouts instead of standard Deployment.
  # Example strategy:
  # steps:
  #   - setWeight: 20
  #   - pause: {}

envVariables: {}
  # ENV_NAME: "value"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific

httpRoute:
  # Gateway API HTTPRoute to this chart's Service; use instead of ingress.
  enabled: false
  annotations: {}
  parentRefs: []
  #  - name: platform
  #    namespace: envoy-gateway-system
  #    sectionName: https
  hostnames: []
  #  - app.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /

resources: {}
